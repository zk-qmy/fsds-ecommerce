version: "1.0"
services:
  # Distributed query engine for various types
  # of data sources
  # ── Query layer ────────────────────────────────────────────────────────────

  trino:
    image: "trinodb/trino:410"
    container_name: fsds-trino
    hostname: trino
    ports:
      - "8080:8080"   # Trino web UI + JDBC — http://localhost:8080
    volumes:
      - ./trino/etc:/usr/lib/trino/etc:ro
      - ./trino/catalog:/etc/trino/catalog
    depends_on:
      - hive-metastore

  # ── Metadata catalog ───────────────────────────────────────────────────────
  # We use PostgreSQL to store Hive metadata about
  # how the datafile are mapped to schemas and tables
  metastore_db:
    image: postgres:11
    container_name: fsds-metastore-db
    hostname: metastore_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER:     hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB:       metastore
  
  # Expose service to get metadata, which is a repository of metadata about the tables, 
  # such as database names, table names, schema and data location of each table
  hive-metastore:
    image: "starburstdata/hive:3.1.2-e.18"
    container_name: fsds-hive-metastore
    hostname: hive-metastore
    ports:
      - "9083:9083"   # Thrift protocol — Trino connects here
    environment:
      HIVE_METASTORE_DRIVER:   org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://metastore_db:5432/metastore
      HIVE_METASTORE_USER:     hive
      HIVE_METASTORE_PASSWORD: hive
      S3_ENDPOINT:             http://minio:9000
      S3_ACCESS_KEY:           minio_access_key
      S3_SECRET_KEY:           minio_secret_key
      S3_PATH_STYLE_ACCESS:    "true"
      REGION:                          ""
      GOOGLE_CLOUD_KEY_FILE_PATH:      ""
      AZURE_ADL_CLIENT_ID:             ""
      AZURE_ADL_CREDENTIAL:            ""
      AZURE_ADL_REFRESH_URL:           ""
      AZURE_ABFS_STORAGE_ACCOUNT:      ""
      AZURE_ABFS_ACCESS_KEY:           ""
      AZURE_WASB_STORAGE_ACCOUNT:      ""
      AZURE_ABFS_OAUTH:                ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID:      ""
      AZURE_ABFS_OAUTH_SECRET:         ""
      AZURE_ABFS_OAUTH_ENDPOINT:       ""
      AZURE_WASB_ACCESS_KEY:           ""
    depends_on:
      - metastore_db

  # ── Object storage — Bronze + Silver Delta Lake ────────────────────────────
  # Parquet files stored in MinIO object storage
  minio:
    image: minio/minio
    container_name: fsds-minio
    hostname: minio
    ports:
      - "9000:9000"   # S3 API — Spark writes here via s3a://
      - "9001:9001"   # Console — http://localhost:9001
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ACCESS_KEY: minio_access_key
      MINIO_SECRET_KEY: minio_secret_key
    command: server --console-address ":9001" /data

  # ── Spark pipeline runner ──────────────────────────────────────────────────
  # Run pipelines with:
  #   docker compose run --rm spark python -m b_schema_pipelines.pipelines.bronze.ingest_bronze
  #   docker compose run --rm spark python -m b_schema_pipelines.pipelines.silver.transform_silver

  # spark:
  #   build:
  #     context: ..
  #     dockerfile: b_schema_pipelines/Dockerfile
  #   container_name: fsds-spark
  #   hostname: spark
  #   depends_on:
  #     - minio
  #   environment:
  #     MINIO_ENDPOINT:   http://minio:9000
  #     MINIO_ACCESS_KEY: minio_access_key
  #     MINIO_SECRET_KEY: minio_secret_key
  #   volumes:
  #     - ..:/app                        # live source mount — edit locally, run in container
  #     - /app/.venv                     # hide Windows .venv; use the Linux one baked into image
  #     - spark_ivy_cache:/root/.ivy2    # cache downloaded JARs across runs
  #   working_dir: /app
  #   command: ["tail", "-f", "/dev/null"]   # keep alive; exec or run commands against it

  # ── Relational DB — Gold tables + feature store + Airflow metadata ─────────

  postgres:
    image: postgres:15
    container_name: fsds-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     fsds
      POSTGRES_PASSWORD: fsds
      POSTGRES_DB:       fsds
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsds"]
      interval: 10s
      retries: 5

  # # ── Online feature store ───────────────────────────────────────────────────

  # redis:
  #   image: redis:7
  #   container_name: fsds-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

  # # ── Experiment tracking + model registry ──────────────────────────────────

  # mlflow:
  #   image: ghcr.io/mlflow/mlflow:v2.11.0
  #   container_name: fsds-mlflow
  #   depends_on:
  #     - postgres
  #     - minio
  #   environment:
  #     AWS_ACCESS_KEY_ID:      minio_access_key
  #     AWS_SECRET_ACCESS_KEY:  minio_secret_key
  #     MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  #   ports:
  #     - "5000:5000"
  #   command: >
  #     mlflow server
  #       --backend-store-uri postgresql://fsds:fsds@postgres:5432/fsds
  #       --default-artifact-root s3://bronze/mlflow-artifacts
  #       --host 0.0.0.0
  #       --port 5000

  # ── Pipeline orchestration ─────────────────────────────────────────────────

  airflow:
    build:
      context: ..
      dockerfile: infra/airflow/Dockerfile
    container_name: fsds-airflow
    # Standard bridge networking, not network_mode: host -- confirmed live that
    # host networking doesn't work under Docker Desktop without an opt-in GUI
    # feature (Settings > Resources > Network > Enable host networking, off by
    # default; `docker info` showed Experimental: false here). Reaches sibling
    # containers by service hostname instead (postgres, minio — same pattern
    # hive-metastore already uses above for S3_ENDPOINT). pipeline_config.yaml's
    # `minio.endpoint` is overridden via MINIO_ENDPOINT below
    # (pipeline_base.py); Postgres URLs are passed explicitly via each script's
    # own `--postgres-url` CLI flag in the DAG files, and the fsds_postgres/
    # fsds_minio Airflow Connections (dags/plan.md §10) point at postgres/minio
    # too — nothing here relies on "localhost" meaning anything but this
    # container's own loopback.
    depends_on:
      - postgres
      - minio
    ports:
      - "8081:8080"   # Airflow web UI — http://localhost:8081 (8080 taken by Trino)
    environment:
      AIRFLOW__CORE__EXECUTOR:                    LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:        postgresql+psycopg2://fsds:fsds@postgres:5432/fsds
      AIRFLOW__CORE__LOAD_EXAMPLES:               "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # Default dags_folder is ~/airflow/dags -- doesn't exist anywhere in the
      # /opt/project bind mount. Confirmed live: without this, `airflow dags
      # list` reports "No data found", not an import error -- Airflow simply
      # never looks in the right place.
      AIRFLOW__CORE__DAGS_FOLDER:                  /opt/project/b_schema_pipelines/dags
      MINIO_ENDPOINT:                              http://minio:9000
      # Fixed local-dev login instead of `airflow standalone`'s randomly
      # generated one-time password -- see the `command:` below for how.
      _AIRFLOW_WWW_USER_USERNAME:                  admin
      _AIRFLOW_WWW_USER_PASSWORD:                  admin
      # Relocates the project's own venv OUT of the /opt/project bind mount --
      # see the /opt/venvs volume comment below for why. dags/*.py's
      # PROJECT_PYTHON constant and this path must be kept in sync.
      UV_PROJECT_ENVIRONMENT:                       /opt/venvs/project
    volumes:
      # Live source mount, not COPY -- DAG/pipeline code edits on the host are
      # picked up without rebuilding the image, matching the (unused) `spark`
      # service's documented pattern above.
      - ..:/opt/project
      # Anonymous volume at the PARENT directory, not at .venv itself --
      # confirmed live that mounting exactly at /opt/project/.venv makes `uv
      # sync` unable to rebuild a stale venv: it can delete everything INSIDE
      # a mounted directory but can't rmdir the mountpoint itself ("Device or
      # resource busy"), and uv does exactly that rmdir when an existing venv's
      # Python interpreter no longer resolves (e.g. after an image rebuild).
      # Mounting one level up means UV_PROJECT_ENVIRONMENT's target
      # (/opt/venvs/project) is a plain, freely-recreatable subdirectory, never
      # a mountpoint -- and still isolates the Linux venv from a Windows-native
      # one the host repo's own .venv/ might have, same as before.
      - /opt/venvs
      - airflow_logs:/opt/airflow/logs
    # uv sync builds/refreshes the project's own Python 3.13 venv from the
    # bind-mounted pyproject.toml/uv.lock on every container start (cheap when
    # already up to date), then hands off to Airflow's normal entrypoint.
    #
    # `airflow db migrate` + `airflow users create` run before `standalone` so
    # the admin/admin login above is fixed rather than the random one-time
    # password `standalone` normally generates and writes to
    # standalone_admin_password.txt -- `standalone` only auto-creates its own
    # user when none exists yet, so pre-creating one here makes that step a
    # no-op. The `create` call is grouped with a `reset-password` fallback
    # (not a bare `|| true`) so a user left over from an earlier run gets its
    # password reset to the fixed one too, instead of silently keeping
    # whatever password it already had -- confirmed live: an earlier revision
    # of this file used an ungrouped `|| true` here, which (via bash's
    # left-to-right && / || chaining) also silently swallowed an unrelated
    # `uv sync --frozen` failure earlier in the same chain.
    # Verified live: admin/admin logs in successfully (scripted login POST to
    # /login/, followed the redirect to /home, confirmed no login form).
    command: >
      bash -c "cd /opt/project && uv sync --frozen && \
      airflow db migrate && \
      (airflow users create --username $${_AIRFLOW_WWW_USER_USERNAME} --password $${_AIRFLOW_WWW_USER_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com || airflow users reset-password --username $${_AIRFLOW_WWW_USER_USERNAME} --password $${_AIRFLOW_WWW_USER_PASSWORD}) && \
      exec airflow standalone"

volumes:
  minio_storage:
  postgres_data:
  # redis_data:
  airflow_logs:
  #spark_ivy_cache:
