packages:
  - org.apache.hadoop:hadoop-aws:3.4.2
  - com.amazonaws:aws-java-sdk-bundle:1.12.367
  - io.delta:delta-spark_2.13:4.1.0
  - org.postgresql:postgresql:42.7.4

minio:
  endpoint: http://localhost:9000
  access_key: minio_access_key
  secret_key: minio_secret_key

postgres:
  # host/port/db overridable via POSTGRES_HOST/PORT/DB env vars (topology, not
  # secrets). user/password stay plaintext here for local dev only — must move
  # to Vault before real deployment (CLAUDE.md's "secrets from Vault" rule).
  host: localhost
  port: 5432
  db: fsds
  user: fsds
  password: fsds

layers:
  bronze:
    local_path: ./b_schema_pipelines/delta_lake_data/bronze
    bucket: bronze-data
    prefix: bronze
  silver:
    local_path: ./b_schema_pipelines/delta_lake_data/silver
    bucket: silver-data
    prefix: silver
  # gold: commented out — Gold lives in PostgreSQL, not MinIO. build_gold.py
  # never calls _resolve_s3_config("gold"); confirmed the gold-data bucket is
  # empty.
  # gold:
  #   local_path: ./b_schema_pipelines/delta_lake_data/gold
  #   bucket: gold-data
  #   prefix: gold
